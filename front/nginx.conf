server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html; # Chemin de destination des fichiers statiques dans le conteneur
        index  index.html index.htm;
        # Ligne cruciale pour les SPAs (comme React) : elle renvoie index.html si la route n'est pas trouvée
        try_files $uri $uri/ /index.html;
    }

    # Configuration pour les erreurs (facultatif)
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}